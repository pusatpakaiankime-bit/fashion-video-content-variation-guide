<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#131724"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:700;letter-spacing:4px">03 / 08 · 四层DNA</p><h1 style="font-size:70px;line-height:1.15">保留什么？<br/>先提取母版DNA</h1><div style="display:grid;gap:20px;font-size:25px"><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">品牌层</b><br/>真实感、端庄度、色彩、光线、人物气质、商品优先级。</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">节奏层</b><br/>总时长范围、镜头密度、音乐重拍强度、快慢段比例。</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">镜头语法层</b><br/>全身/中景/特写比例、常用切镜、动作连接方式。</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">成交层</b><br/>钩子、穿搭完成、版型/功能证明、结尾定格的顺序。</p></div><p style="font-size:25px;color:#cbd1e7;margin-top:35px">默认继承四层DNA，但不锁死逐镜剧情、精确时间码和每个动作。</p></div></foreignObject></svg>
