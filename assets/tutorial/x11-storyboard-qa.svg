<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#e9ecee"/><foreignObject x="70" y="55" width="940" height="1810"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:800;letter-spacing:4px">11 / 12 · 16-PANEL QA</p><h1 style="font-size:64px;line-height:1.15">第1条16格分镜<br/>逐项检查</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:19px"><p style="background:white;padding:17px;border-radius:14px">□ 正好16格、顺序明确</p><p style="background:white;padding:17px;border-radius:14px">□ 每格有效画面9:16</p><p style="background:white;padding:17px;border-radius:14px">□ 同脸同身材同头巾</p><p style="background:white;padding:17px;border-radius:14px">□ 产品DNA逐镜稳定</p><p style="background:white;padding:17px;border-radius:14px">□ 眼神有目标不发呆</p><p style="background:white;padding:17px;border-radius:14px">□ 表情有变化原因</p><p style="background:white;padding:17px;border-radius:14px">□ 左右手没有互换</p><p style="background:white;padding:17px;border-radius:14px">□ 道具没有瞬移</p><p style="background:white;padding:17px;border-radius:14px">□ 没有第三只手</p><p style="background:white;padding:17px;border-radius:14px">□ 动作重心方向连续</p><p style="background:white;padding:17px;border-radius:14px">□ 转场构图可以衔接</p><p style="background:white;padding:17px;border-radius:14px">□ 光影透视脚底融合</p><p style="background:white;padding:17px;border-radius:14px">□ 功能卖点有证据</p><p style="background:white;padding:17px;border-radius:14px">□ 无文字Logo水印</p></div><div style="margin-top:20px;background:#fff3c8;padding:24px;border-radius:18px;font-size:21px"><b>倒水特别检查：</b>持杯手、杯口方向、同侧落点、水珠位置、毛巾来源、擦拭手必须前后一致。</div><div style="margin-top:18px;background:#151826;color:white;padding:24px;border-radius:18px;font-size:20px"><b style="color:#9de9df">修正时：</b>只修正指定格问题，锁定其他正确的人物、产品、时间轴和构图，再输出PASS/FIX/UNKNOWN。</div></div></foreignObject></svg>
