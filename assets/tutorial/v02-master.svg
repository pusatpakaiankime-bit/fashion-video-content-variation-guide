<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#f7f5ef"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:700;letter-spacing:4px">02 / 08 · 选择母版</p><h1 style="font-size:70px;line-height:1.15">裂变之前<br/>必须有合格母版</h1><div style="display:grid;gap:20px;font-size:26px"><p style="background:white;padding:26px;border-radius:18px"><b>可以作为母版：</b><br/>已确认视频、已确认16格分镜、喜欢的参考视频、复刻SKILL的动态母版报告。</p><p style="background:white;padding:26px;border-radius:18px"><b>不能直接称为裂变：</b><br/>只有产品图和模特图，却没有任何视频风格、节奏或镜头参考。</p><p style="background:white;padding:26px;border-radius:18px"><b>先检查母版：</b><br/>人物和产品稳定；时间轴完整；切镜、动作和品牌观感清楚；没有未解决的物理错误。</p></div><div style="margin-top:30px;background:#fff3c8;padding:28px;border-radius:20px;font-size:25px"><b>如果要求逐镜照抄：</b>这属于“视频复刻”，不是“内容裂变”。</div></div></foreignObject></svg>
