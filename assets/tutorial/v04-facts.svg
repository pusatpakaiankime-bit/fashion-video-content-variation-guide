<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#e9ecee"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:700;letter-spacing:4px">04 / 08 · 产品与市场</p><h1 style="font-size:68px;line-height:1.15">一批裂变<br/>共享同一事实卡</h1><div style="font-size:25px;line-height:1.75;background:white;padding:30px;border-radius:22px"><b>素材角色不能混用</b><br/>产品图＝商品外观事实<br/>模特图＝人物身份事实<br/>搭配图＝造型建议<br/>母版＝动态与风格语法</div><div style="font-size:24px;line-height:1.8;background:#151826;color:white;padding:30px;border-radius:22px;margin-top:24px"><b style="color:#9de9df">图片可证明：</b>颜色、轮廓、腰头、抽绳、口袋、裤脚、缝线。<br/><b style="color:#9de9df">必须文字确认：</b>防水、弹力、速干、成分、尺码。<br/><b style="color:#9de9df">不能猜：</b>看不见的背面、隐藏结构和性能。</div><div style="margin-top:24px;background:#fff3c8;border-radius:20px;padding:28px;font-size:24px"><b>马来市场端庄模式：</b>成年头巾模特、长袖长裤、不透明、不露颈胸腰腹腿部、不性感化。</div></div></foreignObject></svg>
