<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#111526"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:800;letter-spacing:4px">01 / 12 · DOWNLOAD</p><h1 style="font-size:70px;line-height:1.15">下载完整的<br/>内容裂变SKILL</h1><p style="font-size:27px;color:#cbd1e7">不要只下载一个SKILL.md文件</p><div style="display:grid;gap:22px;font-size:25px;line-height:1.7"><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">1｜打开GitHub仓库</b><br/>fashion-video-content-variation-guide</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">2｜点击“下载SKILL”</b><br/>文件名应为 fashion-video-content-variation.zip</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">3｜在下载目录找到ZIP</b><br/>Windows通常保存到“下载”文件夹。</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">4｜准备完整解压</b><br/>ZIP里必须同时包含SKILL.md、agents和references。</p></div><div style="margin-top:30px;background:#fff3c8;color:#17130a;padding:27px;border-radius:20px;font-size:24px"><b>检查下载失败：</b>换浏览器重新下载，或使用第3张图的PowerShell一键安装。</div></div></foreignObject></svg>
