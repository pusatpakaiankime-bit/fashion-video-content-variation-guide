<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#f7f5ef"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:700;letter-spacing:4px">05 / 08 · 裂变矩阵</p><h1 style="font-size:68px;line-height:1.15">先看方向<br/>不要立即批量生成</h1><p style="font-size:25px">每个版本先写清：</p><div style="font-size:25px;line-height:1.8;background:white;padding:30px;border-radius:22px">版本编号<br/>主要子类型<br/>开头钩子<br/>核心卖点<br/>动作链<br/>镜头组合<br/>场景/使用情境<br/>与其他版本的区别<br/>风险点</div><div style="margin-top:25px;background:#151826;color:white;padding:28px;border-radius:20px;font-size:24px"><b style="color:#9de9df">可选主要子类型</b><br/>卡点换装、OOTD/Lookbook、GRWM、Try-on、产品展示、UGC广告、Modest/Hijab Fashion。</div><p style="font-size:25px;margin-top:30px"><b>规则：</b>一条只设一个主类型和一个主卖点。</p></div></foreignObject></svg>
