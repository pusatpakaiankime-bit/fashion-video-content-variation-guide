<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#111526"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:800;letter-spacing:4px">06 / 12 · FOUR-LAYER DNA</p><h1 style="font-size:68px;line-height:1.15">裂变保留的<br/>四层母版DNA</h1><div style="display:grid;gap:18px;font-size:24px;line-height:1.65"><p style="background:#ffffff10;padding:26px;border-radius:20px"><b style="color:#9de9df">1 品牌层</b><br/>真实感、端庄度、色彩、光线、人物气质、商品优先级。</p><p style="background:#ffffff10;padding:26px;border-radius:20px"><b style="color:#9de9df">2 节奏层</b><br/>总时长范围、平均镜头密度、音乐重拍强度、快慢段比例。</p><p style="background:#ffffff10;padding:26px;border-radius:20px"><b style="color:#9de9df">3 镜头语法层</b><br/>全身/中景/特写比例、硬切/遮挡切/动作匹配切、推进方式。</p><p style="background:#ffffff10;padding:26px;border-radius:20px"><b style="color:#9de9df">4 成交层</b><br/>钩子、穿搭完成、版型/功能证据、完整造型收尾。</p></div><div style="margin-top:25px;background:#9de9df;color:#101526;padding:27px;border-radius:20px;font-size:24px"><b>锁定四层DNA，不等于锁死：</b>逐镜剧情、每个动作、精确时间码和同一场景。</div><p style="font-size:23px;color:#cbd1e7;margin-top:28px">裂变应让人看出“同一个系列”，但不会觉得在重复播放同一条。</p></div></foreignObject></svg>
