<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#f7f5ef"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:800;letter-spacing:4px">05 / 12 · MASTER</p><h1 style="font-size:68px;line-height:1.15">裂变开始前<br/>准备合格母版</h1><div style="display:grid;gap:20px;font-size:24px;line-height:1.7"><p style="background:white;padding:26px;border-radius:20px"><b>可用母版</b><br/>已确认成片、已确认16格分镜、喜欢的参考视频、复刻SKILL动态母版报告。</p><p style="background:white;padding:26px;border-radius:20px"><b>母版必须看得清</b><br/>时长、镜头密度、主要动作、切镜语法、产品展示顺序和结尾方式。</p><p style="background:white;padding:26px;border-radius:20px"><b>母版必须先合格</b><br/>人物与产品稳定；时间轴完整；没有第三只手、左右漂移或物理错误。</p><p style="background:white;padding:26px;border-radius:20px"><b>只有产品和模特图</b><br/>这属于原创策划，不应假装已经有母版裂变。</p></div><div style="margin-top:28px;background:#fff3c8;padding:26px;border-radius:20px;font-size:24px"><b>判断口诀：</b>照着原片逐镜换内容＝复刻；保留风格DNA再设计新剧情＝裂变。</div></div></foreignObject></svg>
