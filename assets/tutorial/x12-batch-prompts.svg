<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#111526"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:800;letter-spacing:4px">12 / 12 · BATCH &amp; PROMPTS</p><h1 style="font-size:66px;line-height:1.15">第1条通过后<br/>再批量继续</h1><div style="font-size:24px;line-height:1.75;background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">正确顺序</b><br/>确认第1条16格分镜<br/>→ 输出第1条平台提示词<br/>→ 制作第2条时间轴与分镜<br/>→ 独立质检<br/>→ 再输出第2条提示词</div><div style="margin-top:20px;font-size:22px;line-height:1.65;background:#080b12;padding:26px;border-radius:20px"><b style="color:#9de9df">平台提示词必须包含</b><br/>真实素材绑定、人物与端庄约束、产品事实卡、逐段时间轴、镜头与转场、音乐卡点、连续性、画质、无文字规则、负面约束。</div><div style="margin-top:20px;display:grid;gap:14px;font-size:21px"><p style="background:#9de9df;color:#101526;padding:20px;border-radius:16px"><b>Seedance：</b>可限制4000字内，但不能删除时间轴和产品锁定。</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b>可灵：</b>只使用界面真实存在的@引用，不虚构@图号。</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b>OmniFlash：</b>只上传该版本第1格独立9:16首帧，不上传16格拼图。</p></div><div style="margin-top:20px;background:#fff3c8;color:#17130a;padding:24px;border-radius:18px;font-size:21px"><b>批量原则：</b>不要把第1条错误复制给全部版本；每条都重新做质量检查。</div></div></foreignObject></svg>
