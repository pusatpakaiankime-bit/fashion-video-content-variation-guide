<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#e9ecee"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:800;letter-spacing:4px">04 / 12 · VERIFY</p><h1 style="font-size:68px;line-height:1.15">验证安装<br/>失败时怎样排查</h1><div style="background:#151826;color:white;padding:28px;border-radius:22px;font-size:25px;line-height:1.7"><b style="color:#9de9df">测试指令</b><br/>使用 $fashion-video-content-variation，告诉我这个SKILL能做什么，并解释复刻和裂变有什么区别。</div><div style="margin-top:22px;background:white;padding:28px;border-radius:20px;font-size:24px;line-height:1.7"><b>成功回答应包含：</b><br/>合格母版、四层DNA、裂变矩阵、至少两个核心差异、第1条16格分镜、确认后批量继续。</div><div style="margin-top:22px;background:#fff3c8;padding:28px;border-radius:20px;font-size:23px;line-height:1.75"><b>没有识别时按顺序检查：</b><br/>①路径是不是.codex\skills<br/>②第一层有没有SKILL.md<br/>③文件夹有没有多套一层<br/>④是否重新打开Codex<br/>⑤指令是否完整写出$技能名</div><div style="margin-top:22px;background:white;padding:28px;border-radius:20px;font-size:23px"><b>识别错成复刻：</b>明确写“不是逐镜复刻，我要基于合格母版生成多条不同内容”。</div></div></foreignObject></svg>
