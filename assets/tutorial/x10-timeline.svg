<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#f7f5ef"/><foreignObject x="70" y="60" width="940" height="1800"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:800;letter-spacing:4px">10 / 12 · TIMELINE</p><h1 style="font-size:66px;line-height:1.15">测试第1条<br/>时间轴怎样写</h1><div style="font-size:21px;line-height:1.6;background:white;padding:26px;border-radius:20px"><b>10–15秒示例</b><br/>0.00–1.20 钩子：模特拿裤子走入画面，目光看产品<br/>1.20–2.60 遮挡换装：抬手经过镜头，重拍完成换装<br/>2.60–4.20 全身走近：展示正面轮廓与裤长<br/>4.20–5.60 腰头特写：右手轻拉腰头，左手稳定上衣<br/>5.60–7.00 口袋：同一只右手自然插袋<br/>7.00–8.40 侧身：重心转移，展示微喇线条<br/>8.40–10.00 裤脚：低机位跟随一步，布料自然摆动<br/>10.00–12.00 收尾：回到全身，中性微笑定格</div><div style="margin-top:22px;background:#151826;color:white;padding:26px;border-radius:20px;font-size:22px"><b style="color:#9de9df">每段必写：</b><br/>起止时间、景别、动作三态、视线、左右手、道具、产品重点、镜头运动、切镜/转场、音乐事件。</div><div style="margin-top:22px;background:#fff3c8;padding:25px;border-radius:18px;font-size:22px"><b>音轨未知：</b>写“待绑定音乐重拍”，不要编造BPM、歌词或具体音效。</div></div></foreignObject></svg>
