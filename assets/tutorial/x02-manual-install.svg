<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#f7f5ef"/><rect width="28" height="1920" fill="#627cff"/><foreignObject x="78" y="65" width="924" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:800;letter-spacing:4px">02 / 12 · MANUAL INSTALL</p><h1 style="font-size:68px;line-height:1.15">Windows手动安装<br/>每一步都检查</h1><div style="display:grid;gap:17px;font-size:24px"><p style="background:white;padding:24px;border-radius:18px"><b>1. 右键ZIP → 全部解压缩</b><br/>得到fashion-video-content-variation文件夹。</p><p style="background:white;padding:24px;border-radius:18px"><b>2. 打开文件资源管理器</b><br/>在地址栏输入：<code>%USERPROFILE%\.codex\skills</code></p><p style="background:white;padding:24px;border-radius:18px"><b>3. 没有skills文件夹？</b><br/>在.codex里面新建一个skills文件夹。</p><p style="background:white;padding:24px;border-radius:18px"><b>4. 复制完整文件夹</b><br/>不是复制里面的单个文件。</p><p style="background:white;padding:24px;border-radius:18px"><b>5. 第一层结构</b><br/>SKILL.md<br/>agents/openai.yaml<br/>references/variation-rules.md</p><p style="background:white;padding:24px;border-radius:18px"><b>6. 关闭并重开Codex</b><br/>建议新建空白任务测试。</p></div><div style="margin-top:25px;background:#fff3c8;padding:25px;border-radius:18px;font-size:23px"><b>最常见错误：</b>文件夹套了两层，例如 variation/variation/SKILL.md。</div></div></foreignObject></svg>
