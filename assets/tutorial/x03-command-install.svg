<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#131724"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:800;letter-spacing:4px">03 / 12 · ONE COMMAND</p><h1 style="font-size:68px;line-height:1.15">PowerShell<br/>一条指令安装</h1><div style="font-size:25px;line-height:1.75;background:#ffffff10;padding:30px;border-radius:22px">1. Windows开始菜单搜索PowerShell<br/>2. 普通方式打开，不需要管理员<br/>3. 在教程网页找到“一键安装”<br/>4. 点击“复制全文”<br/>5. 粘贴到PowerShell<br/>6. 按Enter并等待完成</div><div style="margin-top:25px;background:#080b12;padding:28px;border-radius:20px;font-size:23px"><b style="color:#9de9df">命令自动执行：</b><br/>下载GitHub ZIP<br/>→ 建立.codex\skills<br/>→ 解压完整SKILL<br/>→ 删除临时ZIP<br/>→ 显示“安装完成”</div><div style="margin-top:25px;background:#9de9df;color:#101526;padding:27px;border-radius:20px;font-size:23px"><b>安全范围：</b>只写入当前用户的Codex Skills目录，不修改系统设置，也不运行ZIP内程序。</div><p style="font-size:23px;color:#cbd1e7;margin-top:28px">若提示网络失败，改用手动下载安装。</p></div></foreignObject></svg>
