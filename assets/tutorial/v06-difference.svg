<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#111526"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:700;letter-spacing:4px">06 / 08 · 差异度</p><h1 style="font-size:68px;line-height:1.15">怎样才算<br/>真正的内容裂变？</h1><div style="font-size:25px;line-height:1.8;background:#ffffff10;padding:30px;border-radius:22px"><b style="color:#9de9df">核心变化：</b><br/>开头钩子、主要子类型、核心卖点、动作链、镜头语法、场景/情境、转场、收尾。</div><div style="margin-top:24px;background:#9de9df;color:#101526;padding:28px;border-radius:20px;font-size:25px"><b>合格：</b>同批版本至少改变两个核心维度，同时保持品牌层、产品DNA、市场和质量标准。</div><div style="margin-top:24px;background:#fff3c8;color:#17130a;padding:28px;border-radius:20px;font-size:25px"><b>不合格：</b>只换背景、颜色、配饰或一句文案；动作链和镜头结构完全相同。</div><p style="font-size:25px;color:#cbd1e7;margin-top:35px">看起来应属于同一系列，但每条都有新内容和独立观看价值。</p></div></foreignObject></svg>
