<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#131724"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:800;letter-spacing:4px">09 / 12 · VIDEO FORMATS</p><h1 style="font-size:67px;line-height:1.15">一条视频只选<br/>一个主要类型</h1><div style="display:grid;gap:14px;font-size:22px;line-height:1.55"><p style="background:#ffffff10;padding:20px;border-radius:16px"><b style="color:#9de9df">卡点换装</b>｜重拍转场与造型完成</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b style="color:#9de9df">OOTD / Lookbook</b>｜整体版型与多角度造型</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b style="color:#9de9df">GRWM</b>｜选择、搭配、换装、完成</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b style="color:#9de9df">Try-on</b>｜上身效果、活动度、尺码感</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b style="color:#9de9df">Product Showcase</b>｜面料、结构和有证据的功能</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b style="color:#9de9df">UGC Fashion Ad</b>｜生活化体验和可信分享</p><p style="background:#ffffff10;padding:20px;border-radius:16px"><b style="color:#9de9df">Modest / Hijab Fashion</b>｜端庄穿搭与本地生活方式</p></div><div style="margin-top:24px;background:#fff3c8;color:#17130a;padding:26px;border-radius:20px;font-size:23px"><b>不要混乱：</b>其他类型可以当辅助镜头，但不能和主类型争抢叙事。</div></div></foreignObject></svg>
