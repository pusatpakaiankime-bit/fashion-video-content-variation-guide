<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#e9ecee"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:700;letter-spacing:4px">07 / 08 · 测试第1条</p><h1 style="font-size:68px;line-height:1.15">先做一条分镜<br/>不要一次做完全部</h1><div style="font-size:25px;line-height:1.8;background:white;padding:30px;border-radius:22px"><b>第1条先交付：</b><br/>1. 主题与核心卖点<br/>2. 从0.00秒开始的完整时间轴<br/>3. 正好16格连续无文字分镜<br/>4. PASS / FIX / UNKNOWN质检</div><div style="margin-top:24px;background:#151826;color:white;padding:28px;border-radius:20px;font-size:23px"><b style="color:#9de9df">每格必须写清</b><br/>时间、景别、动作起/中/止、视线、左右手、道具、产品重点、下一格连接、切镜与音乐事件。</div><div style="margin-top:24px;background:#fff3c8;padding:28px;border-radius:20px;font-size:24px"><b>物理检查：</b>倒水方向、落点、同侧裤腿、毛巾来源和擦拭手必须提前设计，禁止第三只手。</div></div></foreignObject></svg>
