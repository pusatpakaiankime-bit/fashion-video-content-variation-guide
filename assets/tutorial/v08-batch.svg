<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#131724"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:700;letter-spacing:4px">08 / 08 · 批量继续</p><h1 style="font-size:68px;line-height:1.15">第1条通过后<br/>再继续整批内容</h1><div style="display:grid;gap:20px;font-size:24px"><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">步骤1</b><br/>根据已确认分镜输出Seedance、可灵或OmniFlash提示词。</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">步骤2</b><br/>保持产品DNA、人物、市场、端庄度和品牌层不变。</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">步骤3</b><br/>继续策略矩阵中的第2条，仍先看时间轴和16格分镜。</p><p style="background:#ffffff10;padding:28px;border-radius:20px"><b style="color:#9de9df">步骤4</b><br/>每条独立质检，不把第1条错误复制到整批。</p></div><div style="margin-top:28px;background:#9de9df;color:#101526;padding:28px;border-radius:20px;font-size:24px"><b>Omni首帧：</b>只上传该版本第1格独立9:16画面，不上传整张16格拼图。</div><p style="font-size:25px;color:#cbd1e7;margin-top:35px">正确节奏：矩阵 → 第1条分镜 → 确认 → 提示词 → 第2条分镜。</p></div></foreignObject></svg>
