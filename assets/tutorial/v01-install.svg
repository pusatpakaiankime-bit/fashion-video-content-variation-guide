<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#111526"/><foreignObject x="80" y="70" width="920" height="1780"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:white"><p style="color:#9de9df;font-weight:700;letter-spacing:4px">01 / 08 · 安装与验证</p><h1 style="font-size:70px;line-height:1.15">安装“时尚视频<br/>内容裂变”SKILL</h1><div style="font-size:27px;line-height:1.8;background:#ffffff10;border-radius:24px;padding:32px">1. 下载完整ZIP并解压<br/>2. 复制完整文件夹到：<br/><code style="background:#080b12;padding:12px">%USERPROFILE%\.codex\skills</code><br/>3. 第一层检查：SKILL.md、agents、references<br/>4. 完全关闭并重新打开Codex<br/>5. 新建任务输入：<br/><b style="color:#9de9df">使用 $fashion-video-content-variation</b></div><div style="margin-top:32px;background:#fff3c8;color:#17130a;border-radius:20px;padding:28px;font-size:25px"><b>验证成功：</b>回答应说明“从合格母版生成多条同风格但内容不同的视频”。</div></div></foreignObject></svg>
