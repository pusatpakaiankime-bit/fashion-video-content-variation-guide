<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#e9ecee"/><foreignObject x="76" y="65" width="928" height="1790"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:800;letter-spacing:4px">07 / 12 · ASSETS &amp; MARKET</p><h1 style="font-size:67px;line-height:1.15">素材角色、产品事实<br/>与市场本地化</h1><div style="font-size:23px;line-height:1.7;background:white;padding:28px;border-radius:20px"><b>素材不能互相覆盖</b><br/>产品图＝商品外观事实<br/>模特图＝身份、脸、身材<br/>搭配图＝造型建议<br/>母版＝动态与风格语法<br/>场景图＝空间参考</div><div style="margin-top:20px;font-size:23px;line-height:1.7;background:#151826;color:white;padding:28px;border-radius:20px"><b style="color:#9de9df">产品事实卡</b><br/>图片可见：颜色、轮廓、腰头、抽绳、口袋、裤脚、图案、缝线。<br/>必须确认：防水、弹力、速干、材质、尺码。<br/>不可猜：背面和隐藏结构。</div><div style="margin-top:20px;background:#fff3c8;padding:27px;border-radius:20px;font-size:23px;line-height:1.7"><b>马来穆斯林本地化</b><br/>成年头巾模特、长袖长裤、不透明、不性感、不露颈胸腰腹腿部；同步检查场景、礼仪、语言、货币和平台节奏。</div><p style="font-size:23px;margin-top:25px"><b>同一批裂变必须共享同一产品DNA。</b></p></div></foreignObject></svg>
