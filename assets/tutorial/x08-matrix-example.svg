<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#f7f5ef"/><foreignObject x="60" y="55" width="960" height="1810"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft YaHei';color:#11131a"><p style="color:#627cff;font-weight:800;letter-spacing:4px">08 / 12 · MATRIX EXAMPLE</p><h1 style="font-size:64px;line-height:1.15">5条裂变策略矩阵<br/>实际应该这样写</h1><div style="display:grid;gap:13px;font-size:20px;line-height:1.55"><p style="background:white;padding:20px;border-radius:16px"><b>V1 卡点换装｜钩子：</b>抬手遮镜瞬间换装<br/><b>卖点：</b>微喇显腿直｜<b>动作：</b>走近→遮挡→全身→侧身</p><p style="background:white;padding:20px;border-radius:16px"><b>V2 OOTD｜钩子：</b>从门后进入走廊<br/><b>卖点：</b>通勤搭配｜<b>动作：</b>行走→插袋→回身→裤脚特写</p><p style="background:white;padding:20px;border-radius:16px"><b>V3 GRWM｜钩子：</b>床上三件单品快速选择<br/><b>卖点：</b>一裤多搭｜<b>动作：</b>选择→换装→拿包→镜前完成</p><p style="background:white;padding:20px;border-radius:16px"><b>V4 功能展示｜钩子：</b>水滴落在裤面<br/><b>卖点：</b>防水（需事实）｜<b>动作：</b>倒水→水珠→取巾→同侧擦拭</p><p style="background:white;padding:20px;border-radius:16px"><b>V5 UGC｜钩子：</b>镜前自然整理腰头<br/><b>卖点：</b>松紧腰与口袋｜<b>动作：</b>拉腰→插袋→转身→微笑</p></div><div style="margin-top:20px;background:#151826;color:white;padding:24px;border-radius:18px;font-size:21px"><b style="color:#9de9df">每行还要注明：</b>场景、镜头组合、与其他版本的区别、可能的AI风险。</div><p style="font-size:22px;margin-top:20px"><b>先确认矩阵，再只制作V1。</b></p></div></foreignObject></svg>
